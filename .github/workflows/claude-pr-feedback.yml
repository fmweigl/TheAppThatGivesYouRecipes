# .github/workflows/claude-pr-feedback.yml
#
# Lets Claude address review feedback on pull requests. Claude only runs when
# "@claude" appears in a PR comment, an inline review comment or the summary of a
# submitted review, and only for users with write access to the repository.
# It commits its changes to the PR branch, which triggers CI again.

name: Claude PR feedback

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  address-feedback:
    # issue_comment also fires for plain issues; only react on pull requests
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run per PR at a time; later mentions wait instead of racing on the same branch
    concurrency:
      group: claude-pr-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same JDK as ci.yml, so Claude builds under the same conditions as CI
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Lets Claude read CI results on the PR
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 150
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(./gradlew:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
            --append-system-prompt "Address every open review comment on this pull request. Follow CLAUDE.md. Run the check commands from CLAUDE.md before you finish and keep them green. Reply to each comment with what you changed, or why you did not change it. Never change files the review does not ask about."
