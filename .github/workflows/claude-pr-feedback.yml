# .github/workflows/claude-pr-feedback.yml
#
# Lets Claude address review feedback on pull requests. Claude only runs when
# "@claude" appears in a PR comment, an inline review comment or the summary of a
# submitted review, and only for users with write access to the repository.
# It commits its changes to the PR branch, which triggers CI again.

name: Claude PR feedback

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  address-feedback:
    # issue_comment also fires for plain issues; only react on pull requests
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run per PR at a time; later mentions wait instead of racing on the same branch
    concurrency:
      group: claude-pr-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Claude pushes its fixes with these credentials. Pushes made with the
          # default GITHUB_TOKEN show up as github-actions[bot], and GitHub holds
          # the CI run they trigger until a maintainer approves it. The PAT is the
          # one claude-jira-tickets.yml uses, so CI runs right away, as it does on
          # the ticket workflow's PRs.
          token: ${{ secrets.AGENT_GH_TOKEN }}

      # Same JDK as ci.yml, so Claude builds under the same conditions as CI
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - uses: anthropics/claude-code-action@v1
        env:
          # Lets the gh CLI read the PR's reviews and inline review comments.
          # The action doesn't always pass inline comments to Claude, e.g. when
          # it is triggered by a review summary.
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Lets Claude read CI results on the PR
          additional_permissions: |
            actions: read
          # git rm: review comments may ask to delete files.
          # gh pr view / gh api: read-only access to the PR's reviews and comments.
          claude_args: |
            --max-turns 150
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(./gradlew:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git rm:*),Bash(gh pr view:*),Bash(gh api:*)"
            --append-system-prompt "First fetch all inline review comments with: gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number || github.event.issue.number }}/comments --paginate. Also read the reviews and conversation with: gh pr view ${{ github.event.pull_request.number || github.event.issue.number }} --comments. Address every open review comment. Follow CLAUDE.md. Run the check commands from CLAUDE.md before you finish and keep them green. Reply to each comment with what you changed, or why you did not change it. Never change files the review does not ask about."
