name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: detekt, JVM tests and Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Matches gradle/gradle-daemon-jvm.properties (Java 21, Azul), so Gradle doesn't download its own JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Run detekt, JVM tests and build the Android app
        run: ./gradlew detekt jvmTest :androidApp:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  # Releases every master build that passed the job above. versionCode is the workflow's run number,
  # versionName 1.0.<run number>; both go up with every push. Creates the GitHub Release v1.0.<run number>
  # with the signed APK, and uploads the bundle to Google Play's production track when the repository
  # variable PLAY_PUBLISHING is "true". Needs the secrets RELEASE_KEYSTORE_BASE64 (base64 of the upload
  # keystore), RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD and THE_MEAL_DB_API_KEY,
  # and PLAY_SERVICE_ACCOUNT_JSON for Google Play.
  release:
    name: Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore the upload key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build the signed release APK and bundle
        env:
          THE_MEAL_DB_API_KEY: ${{ secrets.THE_MEAL_DB_API_KEY }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/upload.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease -PappVersionCode=${{ github.run_number }}

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$RUNNER_TEMP/theappthatgivesyourecipes-$VERSION_NAME.apk"
          aab="$RUNNER_TEMP/theappthatgivesyourecipes-$VERSION_NAME.aab"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$apk"
          # Google Play only takes bundles; attached for uploading by hand in Play Console.
          cp androidApp/build/outputs/bundle/release/androidApp-release.aab "$aab"
          gh release create "v$VERSION_NAME" "$apk" "$aab" \
            --target "$GITHUB_SHA" \
            --title "$VERSION_NAME" \
            --generate-notes

      - name: Upload to Google Play (production)
        if: vars.PLAY_PUBLISHING == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.fmweigl.theappthatgivesyourecipes
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          mappingFile: androidApp/build/outputs/mapping/release/mapping.txt
          track: production
          status: completed
