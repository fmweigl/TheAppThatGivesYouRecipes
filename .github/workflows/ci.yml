name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: detekt, JVM tests and Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Matches gradle/gradle-daemon-jvm.properties (Java 21, Azul), so Gradle doesn't download its own JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Run detekt, JVM tests and build the Android app
        run: ./gradlew detekt jvmTest :androidApp:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
