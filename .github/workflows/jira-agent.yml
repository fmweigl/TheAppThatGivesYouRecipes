# .github/workflows/jira-agent.yml
#
# Fetches the next Jira ticket with status "Ready for Claude" every hour,
# lets Claude Code implement it, opens a pull request and reports
# the result back to Jira.

name: Jira Agent

on:
  schedule:
    - cron: "17 * * * *" # hourly at minute 17 (UTC)
  workflow_dispatch:
    inputs:
      issue_key:
        description: "Optional: work on a specific ticket (e.g. PROJ-42)"
        required: false

# Never two runs at once, so no ticket is worked on twice
concurrency:
  group: jira-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

# Only non-secret values at job level. Jira secrets are deliberately given
# only to the steps that need them – not to the Claude step.
env:
  JIRA_PROJECT: ${{ vars.JIRA_PROJECT_KEY }}
  STATUS_READY: "Ready for Claude"
  STATUS_IN_PROGRESS: "In Progress"
  STATUS_REVIEW: "In Review"
  STATUS_BLOCKED: "To Do" # where a ticket goes back to when Claude fails
  BASE_BRANCH: master

jobs:
  work-ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Optional PAT, so your CI also runs on agent PRs
          token: ${{ secrets.AGENT_GH_TOKEN || github.token }}

      - name: Provide Jira helper functions
        run: |
          cat > "$RUNNER_TEMP/jira.sh" <<'EOF'
          # jira METHOD PATH [JSON]
          jira() {
            local data=()
            [ -n "${3:-}" ] && data=(--data "$3")
            curl -sS --fail-with-body -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              -H "Accept: application/json" -H "Content-Type: application/json" \
              -X "$1" "$JIRA_BASE_URL/rest/api/3/$2" "${data[@]}"
          }
          # jira_transition KEY "Target status"
          jira_transition() {
            local id
            id=$(jira GET "issue/$1/transitions" \
              | jq -r --arg s "$2" '.transitions[] | select(.to.name == $s) | .id' | head -n1)
            if [ -z "$id" ]; then
              echo "No transition to '$2' found for $1" >&2
              return 1
            fi
            jira POST "issue/$1/transitions" "$(jq -n --arg id "$id" '{transition: {id: $id}}')" > /dev/null
          }
          # jira_comment KEY "Text (multiple lines allowed)"
          jira_comment() {
            local body
            body=$(jq -n --arg t "$2" '{body: {type: "doc", version: 1, content:
              ($t | split("\n") | map(select(length > 0))
                  | map({type: "paragraph", content: [{type: "text", text: .}]}))}}')
            jira POST "issue/$1/comment" "$body" > /dev/null
          }
          EOF

      - name: Fetch next ticket
        id: ticket
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          INPUT_KEY: ${{ github.event.inputs.issue_key }}
        run: |
          source "$RUNNER_TEMP/jira.sh"

          if [ -n "$INPUT_KEY" ]; then
            JQL="key = $INPUT_KEY"
          else
            JQL="project = $JIRA_PROJECT AND status = \"$STATUS_READY\" ORDER BY priority DESC, created ASC"
          fi
          Q=$(jq -rn --arg q "$JQL" '$q | @uri')
          RESULT=$(jira GET "search/jql?maxResults=1&fields=summary,description&jql=$Q")

          KEY=$(echo "$RESULT" | jq -r '.issues[0].key // empty')
          if [ -z "$KEY" ]; then
            echo "No ticket ready – nothing to do."
            exit 0
          fi

          SUMMARY=$(echo "$RESULT" | jq -r '.issues[0].fields.summary')
          # The description comes as Atlassian Document Format; one line per paragraph/heading/list item
          DESCRIPTION=$(echo "$RESULT" | jq -r '
            [.issues[0].fields.description | .. | objects
              | select(.type == "paragraph" or .type == "heading" or .type == "codeBlock")
              | [.content[]? | .text? // empty] | join("")]
            | join("\n")')

          # Set to "In Progress" right away – this is the lock against working on a ticket twice.
          # For a manually given ticket the transition may be missing.
          jira_transition "$KEY" "$STATUS_IN_PROGRESS" || [ -n "$INPUT_KEY" ]

          SLUG=$(echo "$SUMMARY" | iconv -f UTF-8 -t ASCII//TRANSLIT | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-40 | sed -E 's/-+$//')
          BRANCH="feature/$KEY-$SLUG"
          git checkout -b "$BRANCH"

          DELIM=$(openssl rand -hex 12)
          {
            echo "key=$KEY"
            echo "branch=$BRANCH"
            echo "summary=$SUMMARY"
            echo "description<<$DELIM"
            echo "$DESCRIPTION"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        if: steps.ticket.outputs.key != ''
        with:
          distribution: temurin
          java-version: "17" # adjust to your project

      - uses: gradle/actions/setup-gradle@v4
        if: steps.ticket.outputs.key != ''

      - name: Claude implements the ticket
        id: claude
        if: steps.ticket.outputs.key != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Alternatively with an API key:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are working autonomously on a Jira ticket in the repository ${{ github.repository }}.
            Nobody answers questions – make sensible decisions yourself
            or stop (see below).

            ## Ticket ${{ steps.ticket.outputs.key }}: ${{ steps.ticket.outputs.summary }}

            ${{ steps.ticket.outputs.description }}

            ## Approach
            1. First read CLAUDE.md and get an overview of the affected code.
            2. Implement the ticket completely. Follow the existing architecture and
               the conventions from CLAUDE.md. Change nothing the ticket doesn't ask for.
            3. Write or extend tests for the new or changed behavior.
            4. Run the check commands from CLAUDE.md and fix errors until everything is green.
            5. Do NOT commit or push – the workflow does that after you.

            ## When to stop
            Stop and return status "blocked" if
            - the ticket is unclear or contradictory and a wrong assumption would be costly,
            - credentials, assets or infrastructure are missing,
            - you can't get the checks green after serious attempts.
            Explain concretely in blocker_reason what is missing or which question needs to be answered.
            You can leave half-finished changes behind; they will be discarded.

            ## Return value
            - status: "done" or "blocked"
            - title: short PR title without the ticket key, in the imperative
            - pr_body: Markdown – what was changed, why, how it was tested; open points
            - blocker_reason: only when "blocked"
          claude_args: |
            --max-turns 200
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(./gradlew:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
            --json-schema '{"type":"object","properties":{"status":{"type":"string","enum":["done","blocked"]},"title":{"type":"string"},"pr_body":{"type":"string"},"blocker_reason":{"type":"string"}},"required":["status","title","pr_body"]}'

      - name: Create PR and update Jira
        if: steps.ticket.outputs.key != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN || github.token }}
          OUT: ${{ steps.claude.outputs.structured_output }}
          KEY: ${{ steps.ticket.outputs.key }}
          BRANCH: ${{ steps.ticket.outputs.branch }}
        run: |
          source "$RUNNER_TEMP/jira.sh"

          STATUS=$(echo "$OUT" | jq -r '.status // "blocked"')
          if [ "$STATUS" != "done" ] || [ -z "$(git status --porcelain)" ]; then
            REASON=$(echo "$OUT" | jq -r '.blocker_reason // "No changes were produced."')
            jira_comment "$KEY" "Claude couldn't complete the ticket:
          $REASON"
            jira_transition "$KEY" "$STATUS_BLOCKED"
            exit 0
          fi

          TITLE=$(echo "$OUT" | jq -r '.title')
          echo "$OUT" | jq -r '.pr_body' > "$RUNNER_TEMP/pr_body.md"
          printf '\n\n---\nJira: %s/browse/%s\n' "$JIRA_BASE_URL" "$KEY" >> "$RUNNER_TEMP/pr_body.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$KEY: $TITLE"
          # The Claude action revokes its git credentials when it finishes:
          # drop the leftover auth header and push with GH_TOKEN instead.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create --base "$BASE_BRANCH" --head "$BRANCH" \
            --title "$KEY: $TITLE" --body-file "$RUNNER_TEMP/pr_body.md")

          jira_comment "$KEY" "Pull request created: $PR_URL"
          jira_transition "$KEY" "$STATUS_REVIEW"

      # Keep the agent's last commit as an artifact, so its work is never lost
      - name: Save agent patch
        if: always() && steps.ticket.outputs.key != ''
        run: git format-patch -1 HEAD -o "$RUNNER_TEMP/patch" || true

      - name: Upload agent patch
        if: always() && steps.ticket.outputs.key != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-patch-${{ steps.ticket.outputs.key }}
          path: ${{ runner.temp }}/patch
          if-no-files-found: ignore

      - name: Return ticket on failure
        if: (failure() || cancelled()) && steps.ticket.outputs.key != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          KEY: ${{ steps.ticket.outputs.key }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          source "$RUNNER_TEMP/jira.sh"
          jira_comment "$KEY" "Agent run failed or was cancelled: $RUN_URL" || true
          jira_transition "$KEY" "$STATUS_BLOCKED" || true
